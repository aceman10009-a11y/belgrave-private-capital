<section class="transactions-section">

    <div class="section-header">

        <div>

            <small class="section-tag">

                TRANSACTIONS

            </small>

            <h2>

                Recent Activity

            </h2>

        </div>

        <div class="transaction-tools">

            <input
                type="text"
                placeholder="Search transactions...">

            <button class="view-all-btn">

                View All

            </button>

        </div>

    </div>

    <div class="transactions-wrapper">

        <div
            id="transactionCards"
            class="transaction-cards">

        </div>

        <div class="transaction-table">

            <table>

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Description</th>

                        <th>Category</th>

                        <th>Amount</th>

                        <th>Balance</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="transactionTable">

                </tbody>

            </table>

        </div>

    </div>

</section>
