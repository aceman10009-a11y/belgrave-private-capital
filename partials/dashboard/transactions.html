<section class="transactions-section">

    <div class="section-header">

        <div>

            <small class="section-tag">

                TRANSACTIONS

            </small>

            <h2>

                Recent Activity

            </h2>

        </div>

       <div class="transaction-tools">

    <input
        id="transactionSearch"
        type="text"
        placeholder="Search transactions...">

</div>

    </div>

    <div class="transactions-wrapper">

        <!-- Mobile Cards -->

        <div
            id="transactionCards"
            class="transaction-cards">

        </div>

        <!-- Desktop Table -->

        <div class="transaction-table">

            <table>

                <thead>

                    <tr>

                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Balance</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="transactionTable">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Pagination -->

    <div class="transaction-pagination">

        <button
            id="previousTransactions"
            class="pagination-btn">

            ← Previous

        </button>

        <span id="transactionPageInfo">

            Page 1

        </span>

        <button
            id="nextTransactions"
            class="pagination-btn">

            Next →

        </button>

    </div>

</section>
