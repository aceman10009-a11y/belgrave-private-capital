<!-- BELGRAVE ACTION MODAL -->

<div id="actionModal" class="action-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <div class="action-modal-overlay" onclick="closeActionModal()"></div>

    <div class="action-modal-content">

        <button type="button" class="action-modal-close" onclick="closeActionModal()" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div id="modalIcon" class="action-modal-icon">💳</div>

        <h2 id="modalTitle">Belgrave Private Bank</h2>

        <div id="modalMessage">Message</div>

        <button type="button" class="action-modal-button" onclick="closeActionModal()">
            Close
        </button>

    </div>

</div>
