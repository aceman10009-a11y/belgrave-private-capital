<div class="sidebar">

    <!-- ================= LOGO ================= -->

    <div class="sidebar-top">

        <div class="sidebar-logo">

            <div class="logo-circle">
                B
            </div>

            <div class="logo-text">
                <h2>Belgrave</h2>
                <p>PRIVATE BANK</p>
            </div>

        </div>

    </div>


    <!-- ================= NAVIGATION ================= -->

    <nav class="sidebar-nav">

        <!-- DASHBOARD -->

        <a
            href="dashboard.html"
            class="nav-item"
            data-page="dashboard">

            <i class="fa-solid fa-house"></i>

            <span>Dashboard</span>

        </a>


        <!-- ACCOUNTS -->

        <a
            href="accounts.html"
            class="nav-item"
            data-page="accounts">

            <i class="fa-solid fa-building-columns"></i>

            <span>Accounts</span>

        </a>


        <!-- CARDS -->

        <a
            href="#"
            class="nav-item"
            onclick="openCards(); return false;">

            <i class="fa-solid fa-credit-card"></i>

            <span>Cards</span>

        </a>


        <!-- TRANSFER -->

        <a
            href="#"
            class="nav-item"
            onclick="openTransfer(); return false;">

            <i class="fa-solid fa-right-left"></i>

            <span>Transfer</span>

        </a>


        <!-- INVESTMENTS -->

        <a
            href="#"
            class="nav-item"
            onclick="showActionModal(
                '📈',
                'Investments Restricted',
                '<p>All investments are currently locked until 2029.</p>'
            ); return false;">

            <i class="fa-solid fa-chart-line"></i>

            <span>Investments</span>

        </a>


        <!-- STATEMENTS -->

        <a
            href="#"
            class="nav-item"
            onclick="openStatements(); return false;">

            <i class="fa-solid fa-file-lines"></i>

            <span>Statements</span>

        </a>


        <!-- NOTIFICATIONS -->

        <a
            href="#"
            class="nav-item"
            onclick="showActionModal(
                '🔔',
                'Notifications',
                '<p>You have no new banking notifications.</p>'
            ); return false;">

            <i class="fa-solid fa-bell"></i>

            <span>Notifications</span>

        </a>


        <!-- SETTINGS -->

        <a
            href="#"
            class="nav-item"
            onclick="openSettings(); return false;">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </a>

    </nav>


    <!-- ================= RELATIONSHIP MANAGER ================= -->

    <div class="relationship-card">

        <div class="manager-avatar">
            ER
        </div>

        <small>
            Relationship Manager
        </small>

        <h4>
            Emma Richardson
        </h4>

        <span class="online-status">
            ● Available Online
        </span>

        <button
            type="button"
            class="message-btn"
            onclick="openLiveChat()">

            <i class="fa-regular fa-comments"></i>

            Secure Message

        </button>

    </div>


    <!-- ================= LOGOUT ================= -->

    <div class="sidebar-bottom">

        <button
            type="button"
            class="logout-btn"
            onclick="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</div>
