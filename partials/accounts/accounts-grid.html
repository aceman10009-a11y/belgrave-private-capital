<section class="accounts-grid">

    <!-- Checking -->

    <article class="account-card checking">

        <div class="card-top">

            <span>

                Everyday Banking

            </span>

            <i class="fa-solid fa-building-columns"></i>

        </div>

        <h2>

            Checking Account

        </h2>

        <h1>

            $4,285,750.00

        </h1>

        <p>

            Available Balance

        </p>

        <div class="card-actions">

            <button
                onclick="openTransfer()">

                Transfer

            </button>

            <button
                onclick="openStatements()">

                Statement

            </button>

        </div>

    </article>



    <!-- Savings -->

    <article class="account-card savings">

        <div class="card-top">

            <span>

                High Interest

            </span>

            <i class="fa-solid fa-piggy-bank"></i>

        </div>

        <h2>

            Savings Account

        </h2>

        <h1>

            $18,925,000.00

        </h1>

        <p>

            4.65% Annual Yield

        </p>

        <div class="card-actions">

            <button
                onclick="openStatements()">

                Statement

            </button>

            <button
                onclick="openTransfer()">

                Deposit

            </button>

        </div>

    </article>



    <!-- Investments -->

    <article class="account-card investment">

        <div class="card-top">

            <span>

                Wealth Management

            </span>

            <i class="fa-solid fa-chart-line"></i>

        </div>

        <h2>

            Investment Portfolio

        </h2>

        <h1>

            $72,000,000.00

        </h1>

        <p>

            Managed by Belgrave Private Bank

        </p>

        <div class="card-actions">

            <button
                onclick="openInvestments()">

                View Portfolio

            </button>

            <button
                onclick="openSupport()">

                Advisor

            </button>

        </div>

    </article>

</section>
