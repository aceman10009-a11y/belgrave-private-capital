<!-- FINANCIAL SNAPSHOT -->

<section class="stats">


    <div class="section-heading">

        <span 
            class="section-tag"
            data-i18n="home.financialSnapshot.tag">
            FINANCIAL SNAPSHOT
        </span>

        <h2 data-i18n="home.financialSnapshot.title">
            Financial Snapshot
        </h2>

    </div>




    <div class="stats-grid">


        <div class="stat-card">


            <i class="fa-solid fa-building-columns stat-icon"></i>


            <h3 data-i18n="home.financialSnapshot.assets.value">
                $967.9M
            </h3>


            <p data-i18n="home.financialSnapshot.assets.label">
                Assets Under Management
            </p>


        </div>





        <div class="stat-card">


            <i class="fa-solid fa-globe stat-icon"></i>


            <h3 data-i18n="home.financialSnapshot.countries.value">
                42
            </h3>


            <p data-i18n="home.financialSnapshot.countries.label">
                Countries Served
            </p>


        </div>





        <div class="stat-card">


            <i class="fa-solid fa-users stat-icon"></i>


            <h3 data-i18n="home.financialSnapshot.clients.value">
                18,400
            </h3>


            <p data-i18n="home.financialSnapshot.clients.label">
                Private Clients
            </p>


        </div>





        <div class="stat-card">


            <i class="fa-solid fa-shield-halved stat-icon"></i>


            <h3 data-i18n="home.financialSnapshot.availability.value">
                99.98%
            </h3>


            <p data-i18n="home.financialSnapshot.availability.label">
                Platform Availability
            </p>


        </div>


    </div>


</section>
