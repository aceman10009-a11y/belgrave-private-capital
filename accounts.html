<!-- ==========================================================
     LOAD ACCOUNTS PARTIAL
========================================================== -->

<script>

const accountsSections = {

    "dashboard-sidebar":
        "partials/dashboard/accounts-sidebar.html",

    "dashboard-accounts":
        "partials/dashboard/accounts-v2.html"

};


async function loadAccountsPartials() {

    const loaders = Object.entries(accountsSections).map(
        async ([id, path]) => {

            const container =
                document.getElementById(id);

            if (!container) return;

            try {

                const response =
                    await fetch(path);

                if (!response.ok) {

                    throw new Error(
                        `Unable to load ${path}`
                    );

                }

                container.innerHTML =
                    await response.text();

            } catch (error) {

                console.error(error);

            }

        }
    );

    await Promise.all(loaders);

}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await loadAccountsPartials();

        if (typeof initializeSidebar === "function") {
            initializeSidebar();
        }

    }
);

</script>
