<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Belgrave Private Bank | Dashboard</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/dashboard-components.css">
<link rel="stylesheet" href="css/dashboard-sections.css">
<link rel="stylesheet" href="css/dashboard-responsive.css">

<link
href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap"
rel="stylesheet">

<link
rel="icon"
type="image/png"
href="assets/favicon.png">

</head>

<body>

<button
class="menu-btn"
onclick="toggleSidebar()">
☰
</button>

<!-- ================= PIN MODAL ================= -->

<div
class="pin-modal hidden"
id="pinModal">

<div class="pin-box">

<h3>

Enter 4-digit PIN

</h3>

<input
type="password"
maxlength="4"
id="pinInput"
placeholder="••••">

<button onclick="verifyPin()">

Unlock Card

</button>

<p id="pinError"></p>

</div>

</div>

<!-- ================= FIREBASE AUTH ================= -->

<script type="module">

import {
auth,
onAuthStateChanged,
db,
doc,
getDoc
} from "./firebase.js";

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.replace("login.html");

        return;

    }

    const welcome = document.getElementById("welcomeUser");

    if (welcome) {

        welcome.innerHTML = "Loading...";

    }

    const ref = doc(db, "users", user.uid);

    const snap = await getDoc(ref);

    if (snap.exists() && welcome) {

        const data = snap.data();

        welcome.innerHTML =
        `Welcome back, ${data.fullName.split(" ")[0]}`;

    }

});

window.logout = async () => {

    await auth.signOut();

    location.href = "login.html";

};

window.toggleSidebar = () => {

    document
        .querySelector(".sidebar")
        ?.classList.toggle("active");

};

</script>

<!-- ================= DASHBOARD ================= -->

<div class="dashboard-container">

<div id="dashboard-sidebar"></div>

<main class="main-content">

<div id="dashboard-hero"></div>

<div id="dashboard-cards"></div>

<div id="dashboard-actions"></div>

<div id="dashboard-stats"></div>

<div id="dashboard-transactions"></div>

<div id="dashboard-activity"></div>

<div id="dashboard-popups"></div>

</main>

</div>

<!-- ================= LOAD DASHBOARD PARTIALS ================= -->

<script>

const dashboardSections = {

    "dashboard-sidebar":
    "partials/dashboard/sidebar.html",

    "dashboard-hero":
    "partials/dashboard/hero.html",

    "dashboard-cards":
    "partials/dashboard/cards.html",

    "dashboard-actions":
    "partials/dashboard/actions.html",

    "dashboard-stats":
    "partials/dashboard/stats.html",

    "dashboard-transactions":
    "partials/dashboard/transactions.html",

    "dashboard-activity":
    "partials/dashboard/activity.html",

    "dashboard-popups":
    "partials/dashboard/popups.html"

};

async function loadDashboardPartials() {

    const loaders = Object.entries(dashboardSections).map(

        async ([id, path]) => {

            const container = document.getElementById(id);

            if (!container) return;

            try {

                const response = await fetch(path);

                if (!response.ok) {

                    throw new Error(path);

                }

                container.innerHTML =
                    await response.text();

            }

            catch (error) {

                console.error(
                    "Failed loading:",
                    path,
                    error
                );

            }

        }

    );

    await Promise.all(loaders);

}

document.addEventListener(

    "DOMContentLoaded",

    async () => {

        await loadDashboardPartials();

        if (typeof renderTransactions === "function") {

            renderTransactions();

        }

    }

);

</script>
<!-- ================= ACTION MODAL ================= -->

<div id="actionModal" class="action-modal">

    <div class="action-modal-content">

        <button
            class="action-modal-close"
            onclick="closeActionModal()">

            ×

        </button>

        <div class="action-modal-icon"
             id="modalIcon">

            🏦

        </div>

        <h2 id="modalTitle">

            Private Banking

        </h2>

        <p id="modalMessage">

            Message

        </p>

        <button
            class="modal-primary-btn"
            onclick="closeActionModal()">

            Close

        </button>

    </div>

</div>

<!-- ================= APPLICATION ================= -->

<script src="actions.js"></script>

<script src="script.js"></script>

<!-- ================= CARD SECURITY ================= -->

<script>

let cardUnlocked = false;

let revealed = false;

const cardData = {

    last4: "4821",

    fullNumber: "5391 7284 1928 4821"

};

function unlockDashboard() {

    document
        .getElementById("pinModal")
        .classList
        .add("hidden");

}

function verifyPin() {

    const pin =
        document
        .getElementById("pinInput")
        .value;

    if (pin === "1234") {

        cardUnlocked = true;

        unlockDashboard();

    }

    else {

        document
            .getElementById("pinError")
            .innerHTML =
            "Invalid PIN";

    }

}

function toggleCardReveal() {

    if (!cardUnlocked) {

        document
            .getElementById("pinModal")
            .classList
            .remove("hidden");

        return;

    }

    revealed = !revealed;

    document
        .getElementById("cardNumber")
        .innerHTML =

        revealed

        ? cardData.fullNumber

        : "•••• •••• •••• " + cardData.last4;

}

</script>

</body>

</html>
