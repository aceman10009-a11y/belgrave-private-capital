<!-- ==========================================================
     LOAD DASHBOARD PARTIALS
========================================================== -->

<script>

const dashboardSections = {

    "dashboard-sidebar":
        "partials/dashboard/sidebar.html",

    "dashboard-hero":
        "partials/dashboard/hero.html",

    "dashboard-overview":
        "partials/dashboard/overview-v2.html",

    "dashboard-accounts":
        "partials/dashboard/accounts-v2.html",

    "dashboard-cards":
        "partials/dashboard/cards.html",

    "dashboard-actions":
        "partials/dashboard/actions.html",

    "dashboard-stats":
        "partials/dashboard/stats.html",

    "dashboard-transactions":
        "partials/dashboard/transactions.html",

    "dashboard-activity":
        "partials/dashboard/activity.html",

    "dashboard-popups":
        "partials/dashboard/popups.html"

};


async function loadDashboardPartials() {

    const loaders = Object.entries(dashboardSections).map(async ([id, path]) => {

        const container = document.getElementById(id);

        if (!container) return;

        try {

            const response = await fetch(path);

            if (!response.ok) {
                throw new Error(`Unable to load ${path}`);
            }

            container.innerHTML = await response.text();

        } catch (error) {

            console.error(error);

        }

    });

    await Promise.all(loaders);

}



document.addEventListener("DOMContentLoaded", async () => {

    await loadDashboardPartials();

    if (typeof initializeSidebar === "function")
        initializeSidebar();

    if (typeof renderTransactions === "function")
        renderTransactions();

    if (typeof initActivityPanel === "function")
        initActivityPanel();

    if (typeof initLedgerSystem === "function")
        initLedgerSystem();

});

</script>

<!-- ==========================================================
     CARD SECURITY
========================================================== -->

<script>

let cardUnlocked = false;
let revealed = false;

const cardData = {

    last4: "4821",

    fullNumber: "5391 7284 1928 4821"

};

function unlockDashboard() {

    document
        .getElementById("pinModal")
        .classList
        .add("hidden");

}

function verifyPin() {

    const pin = document
        .getElementById("pinInput")
        .value;

    if (pin === "1234") {

        cardUnlocked = true;

        unlockDashboard();

    } else {

        document
            .getElementById("pinError")
            .innerHTML = "Invalid PIN";

    }

}

function toggleCardReveal() {

    if (!cardUnlocked) {

        document
            .getElementById("pinModal")
            .classList
            .remove("hidden");

        return;

    }

    revealed = !revealed;

    document
        .getElementById("cardNumber")
        .innerHTML = revealed
            ? cardData.fullNumber
            : "•••• •••• •••• " + cardData.last4;

}

</script>
